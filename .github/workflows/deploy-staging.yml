name: Deploy Health Bridge - Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build in release mode
        run: cargo build --release
      
      - name: Install Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
      
      - name: Setup Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host healthbridge
            ProxyCommand cloudflared access ssh --hostname ssh.healthbridge.africinnovate.com
            User ${{ secrets.DEPLOY_USER }}
            StrictHostKeyChecking no
          EOF
      
      - name: Upload binary via Cloudflare Tunnel
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o ProxyCommand="cloudflared access ssh --hostname ssh.healthbridge.africinnovate.com" \
            target/release/health-bridge \
            ${{ secrets.DEPLOY_USER }}@ssh.healthbridge.africinnovate.com:${{ secrets.DEPLOY_PATH }}/target/release/
      
      - name: Restart service via Cloudflare Tunnel
        run: |
          ssh -i ~/.ssh/deploy_key healthbridge << 'EOF'
            sudo systemctl restart health-bridge
            sudo systemctl status health-bridge --no-pager
          EOF