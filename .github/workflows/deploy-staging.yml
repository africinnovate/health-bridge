name: Deploy Health Bridge - Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Debug sudo configuration
        run: |
          echo "Current user: $(whoami)"
          echo "User ID: $(id)"
          echo "Sudo version: $(sudo -V | head -1)"
          echo "Testing sudo:"
          sudo -l
          echo "Testing systemctl:"
          /usr/bin/sudo -n /usr/bin/systemctl status health-bridge || echo "Sudo failed with exit code: $?"
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build in release mode
        run: cargo build --release
      
      - name: Stop service before replacing binary
        run: /usr/bin/sudo -n /usr/bin/systemctl stop health-bridge
      
      - name: Copy binary to deployment location
        run: |
          mkdir -p /home/afric/apps/hb/target/release
          cp target/release/health-bridge /home/afric/apps/hb/target/release/
          chmod +x /home/afric/apps/hb/target/release/health-bridge
      
      - name: Start service
        run: /usr/bin/sudo -n /usr/bin/systemctl start health-bridge
      
      - name: Check service status
        run: /usr/bin/sudo -n /usr/bin/systemctl status health-bridge --no-pager

      - name: Show recent logs
        run: /usr/bin/sudo -n /usr/bin/journalctl -u health-bridge -n 20 --no-pager